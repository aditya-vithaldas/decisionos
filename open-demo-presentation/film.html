:root{--bg:#FAFAF9;--ink:#0D0D0D;--ink2:#262626;--mute:#78716C;--mute2:#A8A29E;--line:rgba(0,0,0,.09);--stone:#EFECE7;--stone2:#E7E5E4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,'DejaVu Sans',sans-serif;-webkit-font-smoothing:antialiased}
#scene{position:absolute;inset:0}
.logo{position:absolute;left:64px;top:40px;height:24px}
.meta{position:absolute;right:64px;top:44px;font-size:14px;color:var(--mute)}
.h1{font-family:Display;font-weight:500;font-size:68px;line-height:1.04;letter-spacing:-.025em}
.h2{font-family:Display;font-weight:500;font-size:50px;line-height:1.06;letter-spacing:-.02em}
.h3{font-family:Display;font-weight:500;font-size:25px;line-height:1.2;letter-spacing:-.01em}
.sub{font-size:21px;line-height:1.45;color:var(--mute)}
.small{font-size:16px;line-height:1.5;color:var(--mute)}
.mono{font-family:Mono;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.tile{background:var(--stone);border-radius:12px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:9999px;padding:9px 20px;font-size:15px;font-weight:500}
.pill.black{background:var(--ink);color:#fff}
.pill.out{background:#fff;border:1px solid #D4D4D4;color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:10px;background:rgba(13,13,13,.86);color:#fff;border-radius:9999px;padding:5px 14px 5px 5px;font-size:14px}
.badge i{font-style:normal;background:#fff;color:var(--ink);border-radius:9999px;padding:2px 10px;font-weight:500}
.abs{position:absolute}
.num{font-family:Mono;font-size:14px;color:var(--mute2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--stone2)}
.caret{display:inline-block;width:2px;height:22px;background:var(--ink);vertical-align:-4px;margin-left:2px}
.chip{position:absolute;background:#fff;border:1px solid var(--line);border-radius:9999px;padding:8px 14px;font-family:Mono;font-size:14px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.chip.warn{border-color:#d6d3d1;background:var(--stone)}
.mod{border-radius:12px;padding:16px 16px;font-size:16px;font-weight:500;display:flex;flex-direction:column;justify-content:space-between}
.mod small{font-weight:400;font-size:13px;color:var(--mute)}
.bar{height:10px;border-radius:9999px;background:var(--stone2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:9999px}
.arrow{position:absolute;height:1px;background:#C8C4BF}
.arrow::after{content:'';position:absolute;right:-1px;top:-4px;border:4.5px solid transparent;border-left:7px solid #C8C4BF}
.dark{background:#000;color:#fff}
.ar{font-family:'DejaVu Sans';font-weight:400;font-size:.9em;margin:0 .12em}
</style></head><body>

const stage=document.getElementById('stage'), scene=document.getElementById('scene');
let cur=-1;
const ease=x=>{x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3)};
function setScene(i){ cur=i; const s=SC[i]; stage.style.background=s.dark?'#000':'var(--bg)'; scene.innerHTML=s.html(); window._chips=null; if(s.init) s.init(); }
function setT(t){ const s=SC[cur];
 scene.querySelectorAll('[data-at]').forEach(e=>{ const v=ease((t-parseFloat(e.dataset.at))/.42); e.style.opacity=v; e.style.transform=`translateY(${(1-v)*10}px)`; });
 if(s.tick) s.tick(t);
 const fo=.35; scene.style.opacity = t>s.dur-fo ? Math.max(0,(s.dur-t)/fo) : 1; }
window.SC=SC; window.setScene=setScene; window.setT=setT;
