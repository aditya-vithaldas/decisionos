:root{--ink:#0D0D0D;--soft:#78716C;--or:#0D0D0D;--orl:#EFECE7;--paper:#FAFAF9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:Inter,'Comic Sans MS',cursive}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#fff}
.ink{position:relative}
.ink::before{content:'';position:absolute;inset:0;border:1.7px solid var(--ink);border-radius:var(--r,12px);filter:url(#rough);pointer-events:none}
.ink.or::before{border-color:var(--or);border-width:2.2px}
.ink.dash::before{border-style:dashed}
.cap{position:absolute;left:64px;top:22px;font-family:Display;font-size:30px}
.cap b{font-weight:700}
.cap .tag{color:var(--or)}
.underline{position:absolute;height:5px;background:var(--or);border-radius:3px;filter:url(#rough2);transform-origin:left}
#win{position:absolute;left:64px;top:76px;width:1152px;height:612px;--r:16px}
.bar{height:44px;display:flex;align-items:center;gap:10px;padding:0 18px;position:relative}
.bar::after{content:'';position:absolute;left:0;right:0;bottom:0;border-bottom:1.5px solid var(--ink);filter:url(#rough)}
.dot{width:11px;height:11px;border:1.5px solid var(--ink);border-radius:50%}
.bar .title{margin-left:12px;font-size:19px}
.bar .title b{font-family:Display;font-size:26px;font-weight:700;margin-right:6px}
.steps{margin-left:auto;display:flex;gap:18px;font-size:17px;color:var(--soft)}
.steps span.on{color:var(--or)}
.steps span.done{color:var(--ink)}
.page{position:absolute;left:0;top:44px;right:0;bottom:0;padding:26px 34px}
h2{font-family:Display;font-weight:700;font-size:48px;line-height:1}
.sub{font-size:22px;color:var(--soft);margin-top:6px}
.sources{display:flex;gap:26px;margin-top:34px}
.src{width:340px;height:190px;padding:26px 28px;--r:14px}
.src .ic{font-size:40px;line-height:1;font-family:Inter}
.src .nm{font-size:28px;margin-top:14px}
.src .st{font-size:21px;color:var(--soft);margin-top:8px}
.src.ok .st{color:var(--or)}
.prog{margin-top:40px;width:760px;height:30px;--r:16px;overflow:hidden}
.prog i{position:absolute;left:4px;top:4px;bottom:4px;border-radius:12px;background:repeating-linear-gradient(-55deg,var(--or) 0 3px,transparent 3px 7px)}
.count{font-family:Display;font-size:68px;font-weight:700;margin-top:26px}
.checks{margin-top:14px;font-size:26px;line-height:1.7}
.checks div{opacity:.25}
.checks div.on{opacity:1}
.checks div.on::before{content:'✓ ';color:var(--or)}
.grid{display:grid;grid-template-columns:300px 1fr 1fr;gap:22px;margin-top:18px}
.card{padding:18px 20px;--r:14px;min-height:150px}
.card h3{font-family:Display;font-weight:700;font-size:28px;margin-bottom:6px}
.card li{list-style:none;font-size:19px;line-height:1.45;padding-left:22px;position:relative}
.card li::before{content:'○';position:absolute;left:0;color:var(--ink)}
.card li.q::before{content:'“';color:var(--or);font-family:Display;font-size:30px;top:-6px}
.card li .n{color:var(--soft)}
.big{font-family:Display;font-weight:700;font-size:86px;line-height:1}
.cta{position:absolute;right:34px;bottom:26px;padding:12px 26px;font-size:22px;--r:30px}
.cta.done{background:var(--orl)}
.toast{position:absolute;right:34px;bottom:90px;padding:12px 18px;font-size:19px;--r:12px;background:#fff}
.funnel{display:flex;align-items:flex-end;gap:16px;height:170px;margin-top:8px}
.fb{width:70px;position:relative}
.fb i{position:absolute;left:0;right:0;bottom:0;border:1.5px solid var(--ink);border-radius:6px 6px 2px 2px;filter:url(#rough);background:repeating-linear-gradient(-55deg,#cfcfcf 0 2px,transparent 2px 7px)}
.fb.hot i{border-color:var(--or);background:repeating-linear-gradient(-55deg,var(--or) 0 3px,transparent 3px 7px)}
.fb span{position:absolute;bottom:-26px;left:-10px;right:-10px;text-align:center;font-size:15px}
.fb em{position:absolute;left:0;right:0;text-align:center;font-style:normal;font-size:17px}
.drop{font-family:Display;font-size:26px;color:var(--or);font-weight:700}
.person{display:flex;gap:16px;align-items:center}
.av{width:64px;height:64px;--r:50%;display:flex;align-items:center;justify-content:center;font-family:Display;font-size:30px;font-weight:700}
.risk{height:20px;width:100%;margin-top:10px;--r:12px;overflow:hidden}
.risk i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:9px;background:repeating-linear-gradient(-55deg,var(--or) 0 3px,transparent 3px 7px)}
.pill{display:inline-block;padding:3px 12px;margin:4px 6px 0 0;font-size:18px;--r:20px}
.ask{margin-top:4px;font-size:22px;line-height:1.4}
.btns{display:flex;gap:14px;margin-top:14px}
.btn{padding:9px 20px;font-size:20px;--r:24px;white-space:nowrap}
.btns{flex-shrink:0}
#cursor{position:absolute;width:30px;height:34px;z-index:20;pointer-events:none}
.ripple{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:2px solid var(--or);border-radius:50%;z-index:19}
.fade{will-change:opacity,transform}
.note{position:absolute;right:64px;top:32px;font-size:16px;color:var(--soft)}

/* Open visual language overrides */
#stage{background:#FAFAF9}
.ink::before{border:1px solid rgba(0,0,0,.09)!important;filter:none!important}
.ink.or::before{border:1.5px solid #0D0D0D!important}
.ink.dash::before{border-style:dashed!important}
#win{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 24px 60px rgba(0,0,0,.06)}
.bar::after{border-bottom:1px solid rgba(0,0,0,.09)!important;filter:none!important}
.dot{border:0;background:#E7E5E4}
.bar .title{font-size:15px;font-weight:500}
.steps{font-size:14px;font-weight:500}
.steps span{padding:4px 10px;border-radius:9999px}
.steps span.on{background:#0D0D0D;color:#fff}
.cap{font-family:Display;font-weight:500;font-size:24px;letter-spacing:-.01em;top:26px}
.cap b{font-weight:500}

   <div class="count"><span id="cnt">0</span> <span style="font-size:30px;font-weight:400">${s.unit} analyzed</span></div>
   <div class="checks">${s.checks.map((c,i)=>`<div id="ck${i}">${c}</div>`).join('')}</div></div>
  <div class="page fade" id="p2">${resultHTML(s)}</div>
  ${s.cta?`<div class="cta ink or fade" id="cta">${s.cta}</div>`:''}
  <div class="toast ink or fade" id="toast">✓ Agent created · “Retention check-in” · runs daily at 18:00</div>
 </div>
 <svg id="cursor" viewBox="0 0 30 34"><path d="M3 2 L3 26 L9.5 20 L14 31 L18.5 29 L14 18.5 L23 18.5 Z" fill="#0D0D0D" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
 <div class="ripple" id="rip" style="opacity:0"></div>`;
}

function op(el,v,dy=8){ if(!el) return; el.style.opacity=v; el.style.transform=`translateY(${(1-v)*dy}px)`; el.style.visibility=v<=0.001?'hidden':'visible'; }
function center(id){ const e=document.getElementById(id); if(!e) return [1100,640]; const r=e.getBoundingClientRect(), st=stage.getBoundingClientRect(); return [r.left-st.left+r.width*0.55, r.top-st.top+r.height*0.6]; }

let anchors=null;
function render(t){
 const s=S[sc];
 if(!anchors){ anchors={}; }
 op(cap,fin(t,0,.5),6); op(document.getElementById('ph'),fin(t,0,.5),0); op(note,fin(t,.2,.5),0); op(document.getElementById('valuep'),fin(t,.25,.5),4); op(win,fin(t,0.1,.6),12);
 const capUL=document.getElementById('capul');
 // pages
 const a0=fin(t,.4)* (1-fin(t,T.analyzeStart-.2,.3));
 const a1=fin(t,T.analyzeStart,.3)*(1-fin(t,T.insight-.2,.3));
 const a2=fin(t,T.insight,.4);
 op(p0,a0,10); op(p1,a1,10); op(p2,a2,0);
 // steps
 const stepIdx = t<T.analyzeStart?0: t<T.insight?1: (s.cta||sc==2)&&t>=T.cta?3:2;
 for(let i=0;i<4;i++){ const e=document.getElementById('st'+i); e.className = i<stepIdx?'done':i==stepIdx?'on':''; }
 // connect clicks
 s.sources.forEach((x,i)=>{ const ok=t>=T.connect[i]; const e=document.getElementById('src'+i); e.classList.toggle('ok',ok); e.classList.toggle('or',ok); document.getElementById('sst'+i).textContent = x[2]+(ok?' · connected ✓':' · connect'); });
 // analyzing
 const pr=clamp((t-T.analyzeStart)/(T.analyzeEnd-T.analyzeStart));
 const pe=pr<.5? 2*pr*pr : 1-Math.pow(-2*pr+2,2)/2;
 pbar.style.width=`calc(${pe*100}% - 8px)`;
 cnt.textContent=fmt(pe*s.total);
 s.checks.forEach((c,i)=>document.getElementById('ck'+i).classList.toggle('on', pr>=(i+1)/(s.checks.length+.3)));
 // role selection
 if(s.roles){ op(document.getElementById('roles'), fin(t,T.connect[2]+.25,.35), 6); document.getElementById('role0').classList.toggle('on', t>=T.role); }
 if(s.result==='onboard'){ [0,1,2].forEach(i=>{ const e=document.getElementById('wf'+i); if(e){ const on=t>=T.cta+.15+i*.12; e.textContent=on?'✓ Added':'+ Add'; e.classList.toggle('on',on);} }); }
 // insight cards
 document.querySelectorAll('[data-c]').forEach(e=>op(e, fin(t,T.cards[+e.dataset.c],.45), 14));
 if(s.result==='catalog'){ const g=ease((t-T.cards[0])/1.0)*62; const arc=document.getElementById('arc'); arc.setAttribute('stroke-dasharray',`${g} 100`); document.getElementById('pct').textContent=Math.round(g); }
 if(s.result==='travel'){ document.querySelectorAll('.fbar').forEach((b,i)=>{ b.style.height=(ease((t-T.cards[0]-i*.12)/.5)*b.dataset.h)+'px'; }); }
 if(s.result==='service'){ const g=ease((t-T.cards[0])/1.0)*78; document.getElementById('risk').textContent=Math.round(g); document.getElementById('riskbar').style.width=`calc(${g}% - 6px)`; }
 // CTA + toast
 const ctaEl=document.getElementById('cta'); if(ctaEl){ op(ctaEl, fin(t,T.cards[3]+.5,.4), 8); ctaEl.classList.toggle('done', t>=T.cta); if(t>=T.cta) ctaEl.textContent='✓ '+s.cta.replace(' →','')+' · started'; }
 const yes=document.getElementById('yes'); if(yes){ yes.classList.toggle('done',t>=T.cta); yes.style.background=t>=T.cta?'var(--orl)':''; }
 op(toast,0,0);
 const ask=document.getElementById('ask'); if(ask){ ask.innerHTML = t>=T.cta+.3 ? '<b style="font-weight:500">✓ Agent created:</b> “Retention check-in” reaches all <b>212</b> at-risk customers on their own channel, at their own time.' : 'Do you want to set up an agent to do this for all <b>212</b> at-risk customers?'; }
 // cursor path: rest -> sources -> rest -> CTA
 if(!anchors.ready){ anchors.src=[0,1,2].map(i=>center('src'+i)); anchors.cta=center(sc==2?'yes':'cta'); anchors.role=center('role0'); anchors.ready=true; }
 const keys=[[0,[1150,690]],[1.3,[1150,690]],...T.connect.map((tc,i)=>[tc-.05,anchors.src[i]]),...(s.roles?[[T.role-.05,anchors.role],[T.role+.35,anchors.role]]:[]),[(s.roles?T.role:T.connect[2])+.6,[1020,600]],[T.cta-1.0,[1020,600]],[T.cta-.05,anchors.cta],[T.end,anchors.cta]];
 let p=keys[0][1];
 for(let k=0;k<keys.length-1;k++){ const [t0,a]=keys[k],[t1,b]=keys[k+1]; if(t>=t0&&t<=t1){ const u=ease((t-t0)/(t1-t0)); p=[a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u + Math.sin(u*Math.PI)*-18]; break;} if(t>t1) p=b; }
 cursor.style.left=p[0]+'px'; cursor.style.top=p[1]+'px';
 op(cursor, fin(t,1.0,.3)*(1-fin(t,T.end-.6,.3)),0);
 // click ripples
 let rv=0, rp=null; [...T.connect,...(s.roles?[T.role]:[]),T.cta].forEach(tc=>{ const d=t-tc; if(d>=0&&d<.45){ rv=1-d/.45; rp=tc; } });
 if(rp!==null){ rip.style.left=(p[0]+3)+'px'; rip.style.top=(p[1]+3)+'px'; rip.style.opacity=rv; rip.style.transform=`scale(${1.4-rv*.8})`; } else rip.style.opacity=0;
}

build();
const cap=document.getElementById('cap'),note=document.getElementById('note'),win=document.getElementById('win'),p0=document.getElementById('p0'),p1=document.getElementById('p1'),p2=document.getElementById('p2'),pbar=document.getElementById('pbar'),cnt=document.getElementById('cnt'),toast=document.getElementById('toast'),cursor=document.getElementById('cursor'),rip=document.getElementById('rip');
window.setT = t => render(t);
window.setScenario = i => { sc=i; anchors=null; build(); location.reload; };
if(!qs.has('capture')){
  let t0=performance.now();
  (function loop(){ const t=(performance.now()-t0)/1000; render(t); if(t>T.end+1.5){ sc=(sc+1)%3; build(); Object.assign(window,{}); t0=performance.now(); location.search='?s='+sc; return;} requestAnimationFrame(loop); })();
} else { render(0); }
</script></body></html>
