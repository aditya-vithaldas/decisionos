<div id="commerce-rca">
  <div class="viz-row"><h2>What changed revenue?</h2><span class="viz-badge">Database evidence</span></div>
  <p id="rca-period" class="text-small text-muted"></p>
  <div class="viz-grid"><div class="card viz-stat"><span>Same weekday last week</span><div id="rca-baseline" class="viz-stat-value tabular-nums"></div></div><div class="card viz-stat"><span>Latest complete day</span><div id="rca-current" class="viz-stat-value tabular-nums"></div></div><div class="card viz-stat"><span>Revenue change · USD</span><div id="rca-change" class="viz-stat-value tabular-nums"></div><span id="rca-percent" class="text-small"></span></div></div>
  <h3>Revenue bridge</h3><div id="rca-bridge"></div>
  <div id="rca-drivers" class="viz-row"></div><div id="rca-evidence" class="text-small" aria-live="polite"></div>
  <h3>Largest measured segment declines</h3>
  <label class="form-label" for="rca-dimension">Breakdown</label><select class="form-select" id="rca-dimension"><option value="categories">Category</option><option value="regions">Region</option><option value="channels">Channel</option></select>
  <div class="table-responsive"><table class="table table-sm"><thead><tr><th>Segment</th><th class="text-end">Baseline</th><th class="text-end">Current</th><th class="text-end">Change · USD</th></tr></thead><tbody id="rca-segments"></tbody></table></div>
  <p class="text-small text-muted">Each breakdown reconciles separately. Changes across category, region and channel overlap.</p>
  <div id="rca-context" class="text-small"></div><footer id="rca-source" class="text-small text-muted"></footer>
</div>
<style>
#commerce-rca{color:var(--foreground)}#commerce-rca .viz-row{justify-content:space-between}#commerce-rca h3{margin-top:18px}#commerce-rca footer{margin-top:12px;overflow-wrap:anywhere}#commerce-rca svg{display:block;width:100%}#commerce-rca svg text{fill:var(--foreground);font-size:12px;font-weight:400}#commerce-rca #rca-drivers{justify-content:flex-start;margin:8px 0}#commerce-rca td:first-child{overflow-wrap:anywhere}
</style>
<script id="commerce-snapshot" type="application/json">__COMMERCE_SNAPSHOT__</script>
<script>
(()=>{const root=document.getElementById('commerce-rca'),q=id=>root.querySelector('#'+id),d=JSON.parse(document.getElementById('commerce-snapshot').textContent),effects=d.attribution.effects;const usd=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v),short=v=>new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:1}).format(v),signed=v=>(v<0?'−':'+')+usd(Math.abs(v)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let selected=0;
q('rca-period').textContent=d.dataThrough+' vs '+d.baselineDate+' · Complete days · USD';q('rca-baseline').textContent=usd(d.baseline.revenue);q('rca-current').textContent=usd(d.current.revenue);q('rca-change').textContent=signed(d.change);q('rca-percent').textContent=(d.changePct>=0?'+':'')+d.changePct.toFixed(2)+'%';
function evidence(){const e=effects[selected],value=v=>e.unit==='USD'?usd(v):e.unit==='%'?v.toFixed(2)+'%':Math.round(v).toLocaleString('en-US');q('rca-evidence').textContent=e.driver+': '+value(e.baseline)+' → '+value(e.current)+' · '+signed(e.effect)+' mathematical contribution. '+(selected===1?'Completed orders / sessions; includes cancelled and returned orders only in the traffic denominator. ':'')+'Sequential decomposition; this is not causal proof.';q('rca-drivers').querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===selected)));}
q('rca-drivers').innerHTML=effects.map((e,i)=>'<button type="button" class="btn" data-driver="'+i+'" aria-pressed="'+(i===selected)+'">'+esc(e.driver)+' · '+signed(e.effect)+'</button>').join('');q('rca-drivers').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{selected=+b.dataset.driver;evidence();draw();}));
function segments(){const all=d[q('rca-dimension').value],negative=all.filter(x=>x.current<x.baseline).sort((a,b)=>(a.current-a.baseline)-(b.current-b.baseline)).slice(0,5);q('rca-segments').innerHTML=negative.length?negative.map(x=>'<tr><td>'+esc(x.label)+'</td><td class="text-end">'+usd(x.baseline)+'</td><td class="text-end">'+usd(x.current)+'</td><td class="text-end">'+signed(x.current-x.baseline)+'</td></tr>').join(''):'<tr><td colspan="4">No segment declines in this breakdown.</td></tr>';}
q('rca-dimension').addEventListener('change',segments);q('rca-context').textContent='Scenario context: '+d.events.map(x=>x.event_name+' — '+x.summary).join(' · ')+' Context is synthetic and does not establish a cause. Inventory availability and payment-error measurements are unavailable.';q('rca-source').textContent=d.datasetVersion+' · Data through '+d.dataThrough+' · '+d.source.generation.model+' · Unexplained residual '+usd(d.attribution.unexplained);
function draw(){const bars=[{name:'Baseline',lo:0,hi:d.baseline.revenue,amount:d.baseline.revenue}],level=d.baseline.revenue;let cursor=level;effects.forEach((e,i)=>{const end=cursor+e.effect;bars.push({name:['Traffic','Conversion','AOV'][i],lo:Math.min(cursor,end),hi:Math.max(cursor,end),amount:e.effect,driver:i});cursor=end;});if(Math.abs(d.attribution.unexplained)>.01){const end=cursor+d.attribution.unexplained;bars.push({name:'Residual',lo:Math.min(cursor,end),hi:Math.max(cursor,end),amount:d.attribution.unexplained});}bars.push({name:'Current',lo:0,hi:d.current.revenue,amount:d.current.revenue});const w=Math.max(280,q('rca-bridge').clientWidth),h=224,l=68,r=12,t=28,b=50,pw=w-l-r,ph=h-t-b,minimum=Math.min(0,...bars.map(x=>x.lo)),maximum=Math.max(...bars.map(x=>x.hi)),span=maximum-minimum,pad=span*.15,min=minimum<0?minimum-pad:0,max=maximum+pad,y=v=>t+ph*(1-(v-min)/(max-min)),step=pw/bars.length,bw=step*.52;let s='<rect data-chart-frame x="'+l+'" y="'+t+'" width="'+pw+'" height="'+ph+'" fill="none" stroke="var(--border)"/>';[min,(min+max)/2,max].forEach(v=>s+='<text x="'+(l-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+short(v)+'</text>');bars.forEach((a,i)=>{const x=l+step*(i+.24),color=a.driver===undefined?'var(--viz-series-1)':a.amount<0?'var(--viz-series-2)':'var(--viz-series-3)';s+='<rect x="'+x+'" y="'+y(a.hi)+'" width="'+bw+'" height="'+Math.max(.8,y(a.lo)-y(a.hi))+'" fill="'+color+'" opacity="'+(a.driver===undefined||a.driver===selected?1:.5)+'" data-tooltip="'+esc(a.name+': '+(a.driver===undefined?usd(a.amount):signed(a.amount)))+'"/><text x="'+(x+bw/2)+'" y="'+(y(a.hi)-7)+'" text-anchor="middle">'+(a.driver===undefined?'':a.amount<0?'−':'+')+short(Math.abs(a.amount))+'</text><text x="'+(x+bw/2)+'" y="'+(h-28)+'" text-anchor="middle">'+(w<450?({'Baseline':'Base','Conversion':'Conv.','Current':'Now'}[a.name]||a.name):a.name)+'</text>';});s+='<text class="axis-title" data-axis="y" x="0" y="16">USD</text><text class="axis-title" data-axis="x" x="'+(l+pw/2)+'" y="'+(h-5)+'" text-anchor="middle">Revenue and driver effects</text>';q('rca-bridge').innerHTML='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc('Revenue bridge in USD. '+bars.map(x=>x.name+' '+usd(x.amount)).join('; '))+'">'+s+'</svg>';}
new ResizeObserver(draw).observe(q('rca-bridge'));evidence();segments();draw();})();
</script>
